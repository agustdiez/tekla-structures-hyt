<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tocbot@4.36.8/dist/tocbot.css">
<script src="https://cdn.jsdelivr.net/npm/tocbot@4.36.8/dist/tocbot.min.js"></script>
<script>
  window.addEventListener('load', function() {
    console.log('tocbot disponible?', typeof tocbot);
    
    if (typeof tocbot === 'undefined') {
      console.error('tocbot no se cargó');
      return;
    }
    
    const content = document.querySelector('.main-content');
    if (!content) {
      console.error('no se encontró .main-content');
      return;
    }
    
    const headings = content.querySelectorAll('h2, h3');
    console.log('headings encontrados:', headings.length);
    if (headings.length < 2) return;
    
    const aside = document.createElement('aside');
    aside.className = 'toc-sidebar';
    aside.innerHTML = '<p class="toc-title">En esta página</p><div class="js-toc"></div>';
    document.body.appendChild(aside);
    
    tocbot.init({
      tocSelector: '.js-toc',
      contentSelector: '.main-content',
      headingSelector: 'h2, h3',
      hasInnerContainers: true,
      headingsOffset: 60,
      scrollSmoothOffset: -60,
    });
    
    console.log('tocbot inicializado');
  });
</script>
